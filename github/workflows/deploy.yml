name: CI/CD Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: Kiểm tra cấu trúc và thẻ HTML
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Kiểm tra đủ 3 file bắt buộc
        run: |
          if [[ ! -f "index.html" || ! -f "style.css" || ! -f "script.js" ]]; then
            echo "Lỗi: Thiếu một trong 3 file index.html, style.css, script.js!"
            exit 1
          fi
          echo "OK: Đã có đủ 3 file."

      - name: Kiểm tra thẻ <title> trong index.html
        run: |
          if ! grep -qi "<title>.*</title>" index.html; then
            echo "Lỗi: File index.html thiếu thẻ <title> hoặc thẻ rỗng!"
            exit 1
          fi
          echo "OK: Thẻ <title> hợp lệ."

  # Job 2: Chỉ deploy khi job check thành công
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4